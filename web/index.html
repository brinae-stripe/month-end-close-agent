<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Month-End Close Agent</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">Month-End Close Agent</div>
      <nav class="tabs">
        <button class="tab-btn active" data-view="ask">Ask</button>
        <button class="tab-btn" data-view="close">Close</button>
        <button class="tab-btn" data-view="margin">Margin</button>
        <button class="tab-btn" data-view="residents">Residents</button>
      </nav>
      <div class="model-month" id="model-month"></div>
    </header>

    <main class="views">
      <section id="view-ask" class="view active"></section>
      <section id="view-close" class="view"></section>
      <section id="view-margin" class="view"></section>
      <section id="view-residents" class="view"></section>
    </main>

    <div id="assumptions-panel" class="assumptions-panel"></div>
    <footer class="watermark">Illustrative prototype &mdash; synthetic data. Agent actions are simulated; no Stripe API call is made.</footer>
  </div>

  <script src="app.js"></script>
  <script src="svg-charts.js"></script>
  <script src="close.js"></script>
  <script src="ask.js"></script>
  <script src="margin.js"></script>
  <script src="residents.js"></script>
</body>
</html>
